[project]
name = "setec"
version = "0.1.0"
description = "Collects academic data from SIGA, runs an ETL into PostgreSQL and exposes it as tools for an agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.12.0",
    "playwright>=1.48",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
